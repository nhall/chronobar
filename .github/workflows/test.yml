# Runs the test suite on every pull request and on each push to main.
# The suite needs Xcode (Swift Testing), which GitHub's macOS runners include.
name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift --version
      - run: swift test

  # The oldest toolchain the README promises: Xcode and the Command Line Tools 16.3, Swift 6.1 (the MCP
  # SDK's code needs 6.1). Builds the app as the Homebrew formula does, then runs the tests.
  oldest-toolchain:
    name: test (Xcode ${{ matrix.xcode }})
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        xcode: ["16.3"]
    env:
      XCODE: ${{ matrix.xcode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo xcode-select --switch "/Applications/Xcode_$XCODE.app"
      - run: swift --version
      - run: scripts/bundle-app.sh build
      - run: swift test

  # The Dockerfile Glama builds to list and score the MCP tools (ADR 0009): builds it and checks the
  # server answers and lists its tools, so a macOS-only change can't break it unnoticed.
  linux:
    name: linux (MCP image)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t chronobar-mcp .
      - run: scripts/check-mcp-tools.sh docker run -i --rm chronobar-mcp
